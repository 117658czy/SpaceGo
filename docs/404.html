<!DOCTYPE html>
<!--
  404 页面：GitHub Pages 在路径不存在时会自动使用该文件。
  作用：把误入的访客接回主页，而不是留一个 GitHub 默认 404。
-->
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 · SpaceGo 维空弈</title>
  <meta name="robots" content="noindex">
  <meta http-equiv="refresh" content="3; url=/SpaceGo/">
  <style>
    :root {
      --bg: #0a0f0d;
      --panel: #111a16;
      --border: #1f2e28;
      --text: #e9f1ec;
      --muted: #93a79d;
      --accent: #3ee08a;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(800px 420px at 50% 0%, rgba(62, 224, 138, 0.12), transparent 65%),
        var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      text-align: center;
    }
    .card {
      max-width: 520px;
      padding: 38px 32px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 16px;
    }
    .code { font-family: ui-monospace, Consolas, monospace; font-size: 54px; color: var(--accent); letter-spacing: -0.03em; }
    h1 { font-size: 20px; margin: 10px 0 8px; }
    p { color: var(--muted); font-size: 14.5px; line-height: 1.7; margin: 0 0 22px; }
    a {
      display: inline-block;
      padding: 10px 18px;
      border-radius: 10px;
      background: linear-gradient(180deg, #45e894, #23b96c);
      color: #042414;
      font-weight: 650;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="code">404</div>
    <h1>这个交叉点没有棋子</h1>
    <p>页面不存在，3 秒后自动回到项目主页。<br>Page not found — redirecting to the project home in 3 seconds.</p>
    <a href="/SpaceGo/">返回主页 / Back to home</a>
  </div>
</body>
</html>
